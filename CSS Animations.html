<!DOCTYPE html>
<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<title>CSS Animations</title>
<style type="text/css">
@keyframes move {
  from { left: 0; top: 0; }
  50%  { left: 500px; top: 0; }
  to   { left: 500px; top: 500px; }
}
#anim1 {
  animation: move 5s ease-out 0s infinite alternate;
  position: absolute;
  height: 100px;
  width: 100px;
  background-color: purple;
  color: white;
}
</style>
</head>
<body>
<div id="anim1">Watch me move!</div>
</body>
</html>
