<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01//EN"
"http://www.w3.org/TR/html4/strict.dtd">
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Simple Style Element Example</title>
    <style type="text/css">
        body { background: black; color: white; font: 12px Helvetica; }
        h1 { color: red; font: 14px Impact; }
    </style>
</head>
<body>
    <h1>A 14‑pixel red impact heading on a black background</h1>
    <p>Regular body text, which is 12 pixel white helvetica.</p>
</body>
</html>
