<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Embedded Styles</title>
    <style type="text/css" media="all">
        body {
            font-size: medium;
            font-family: Serif;
            color: white;
        }
        #page {
            background-color: white;
            color: black;
            padding: 1em;
        }
        h1 {
            font-size: xx-large;
            font-family: sans‑serif;
            color: black;
            text-align: center;
            border-bottom: 2px solid black;
        }
        p {
            text-indent: 1em;
            text-align: justify;
            line-height: 150%;
        }
        a:link { color: blue; text-decoration: none; }
        a:visited { color: red; text-decoration: none; }
        a:hover { color: red; text-decoration: underline; }
        a:active { color: red; text-decoration: none; }
    </style>
</head>
<body>
    <div id="page">
        <h1>HTML with Embedded style</h1>
        <p>cascading style sheets 2.1 as defined by the <a href="http://example.com">powerful page layout facilities</a>. The technology depends on correct markup so make sure you get that right too!</p>
    </div>
</body>
</html>
