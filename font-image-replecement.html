<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Font Image Replacement Example</title>
<style type="text/css">
h1.replace {
  background: #fff url(hello.gif) no-repeat;
  width: 88px;
  height: 24px;
}
h1.replace span {
  display: none;
}
</style>
</head>
<body>
<h1 class="replace"><span>Hello</span></h1>
</body>
</html>
