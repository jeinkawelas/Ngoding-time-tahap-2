<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="content-type" content="text/html; charset=utf-8">
    <title>Datalist Test</title>
</head>
<body>
    <form action="#" method="get">
        <p>
            <label>Drinks:
                <input type="text" list="soda">
            </label>
        </p>
        <datalist id="soda">
            <option>coke</option>
            <option>pepsi</option>
            <option>Dr. pepper</option>
            <option>Mr. pibb</option>
            <option>Mt. Dew</option>
            <option>7‑Up</option>
        </datalist>
    </form>
</body>
</html>
